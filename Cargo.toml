[package]
name = "observista"
version = "0.0.1"
authors = ["Riccardo De Benedictis"]
edition = "2024"
description = "Combined deduCtiOn and abduCtiOn (CoCo) reasoner is a dual-process inspired cognitive architecture built in Rust"
readme = "README.md"
repository = "https://github.com/pstlab/OBSERVISTA"
license-file = "LICENSE"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tokio = { version = "1.53.1", features = ["full"] }
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
argon2 = { version = "0.6.0" }
serde = "1.0.229"
mongodb = { version = "3.8.2" }
futures = "0.3.34"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }
serde_json = "1.0.151"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
futures-util = { version = "0.3.34" }
yup-oauth2 = { version = "12.1.2" }
